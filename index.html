<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>404 — Page Not Found</title>
<style>
/* Looks like a boring 404 to anyone who visits directly */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#333;font:14px/1.6 -apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.wrap{max-width:480px;padding:40px 20px}
h1{font-size:48px;font-weight:300;color:#999;margin-bottom:8px}
p{color:#999;font-size:14px}
a{color:#0070f3;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1>404</h1>
  <p>This page does not exist.</p>
  <p style="margin-top:8px"><a href="/">Go home</a></p>
</div>

<script>
/**
 * Bridge OS — Phantom Relay Node
 * github.com/HorrisEllis/Bridge-v2
 *
 * Externally appears to be a 404 page.
 * Service Worker intercepts Bridge relay requests silently.
 */

(async () => {
  if (!('serviceWorker' in navigator)) return;

  // Derive the base path dynamically so this works whether the site is
  // served from the repo root (user/org page: /) or a project subdirectory
  // (project page: /repo-name/).
  // e.g. https://horrisellis.github.io/bridge-test2/ → basePath = '/bridge-test2'
  const basePath = location.pathname.replace(/\/$/, '').replace(/\/[^/]*$/, '') || '';
  // If served from /relay subfolder of the repo (GitHub Pages source = /relay),
  // the pathname here will just be '/bridge-test2/' — basePath = '/bridge-test2'
  // SW file is at same level: __relay-sw.js → relative path works fine.

  try {
    const swUrl   = '__relay-sw.js';           // relative — same directory as this page
    const swScope = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';

    const reg = await navigator.serviceWorker.register(swUrl, {
      scope:          swScope,
      updateViaCache: 'none',
    });

    // Force activate immediately
    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });

    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (sw) sw.addEventListener('statechange', () => {
        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
          sw.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    });

  } catch (e) {
    // Silent — relay degrades gracefully
  }

  // Announce relay availability to Bridge network
  if (window.parent !== window) {
    try {
      window.parent.postMessage({
        type:    'BRIDGE_RELAY_READY',
        relay:   window.location.origin + (location.pathname.replace(/\/$/, '')),
        version: '1.0.0',
        hops:    ['/__relay/forward'],
      }, '*');
    } catch {}
  }

  try {
    const bc = new BroadcastChannel('bridge-relay-announce');
    bc.postMessage({
      type:   'RELAY_ALIVE',
      origin: window.location.origin,
      path:   location.pathname.replace(/\/$/, ''),
      ts:     Date.now(),
    });
    bc.close();
  } catch {}

})();
</script>

<!-- Service Worker registered above. Relay logic in __relay-sw.js -->
</body>
</html>
